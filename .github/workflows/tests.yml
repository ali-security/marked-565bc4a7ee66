name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated spec files to run (empty = full suite)"
        required: false
        default: ""

jobs:
  Test:
    strategy:
      fail-fast: false
      matrix:
        # Upstream matrix was ['lts/*', 'node']; pinned to what those aliases
        # meant at the 2.0.6 release (2021-05-27) so the suite runs on the
        # release-era runtimes instead of today's. Node 8 (the engines.node
        # floor) is not viable: jasmine 3.7's lib/loader.js uses dynamic
        # import(), which Node 8 cannot parse.
        node_version: ['14', '16']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        run: |
          if [ -n "${{ github.event.inputs.test-filter }}" ]; then
            npm test -- ${{ github.event.inputs.test-filter }}
          else
            npm run test:unit
          fi
      - name: Run Spec Tests 👩🏽‍💻
        run: |
          if [ -n "${{ github.event.inputs.test-filter }}" ]; then
            echo "Spec tests covered by the filtered run above"
          else
            npm run test:specs
          fi

  Lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '14'
      - name: Install Dependencies
        run: npm ci
      - name: Lint ✨
        run: npm run test:lint

  Pack:
    needs: [Test, Lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '14.17.0'
      - name: Install Dependencies
        run: npm ci
      - name: Build 🗜️
        run: npm run build
      - name: Use the npm version the release was packed with
        run: npm i -g npm@7.12.0
      - name: Pack 📦
        run: npm pack
      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: marked-*.tgz
          if-no-files-found: error
